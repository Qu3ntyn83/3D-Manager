name: Android-App

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Signaturschlüssel
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 fehlt – APK wird nur mit Debug-Schlüssel signiert (nicht als Update installierbar)."
          fi
      - name: Tests und APK bauen
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/3D-Manager.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: 3D-Manager-apk
          path: 3D-Manager.apk
      - name: Als Release „android“ veröffentlichen
        if: github.event_name != 'pull_request' && env.ANDROID_KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Android-App (NFC)
          make_latest: false
          body: |
            3D Manager als Android-App mit NFC-Leser für Bambu-RFID-Tags.
            Version 1.${{ github.run_number }} · Auf dem Handy herunterladen und installieren (Installation aus unbekannten Quellen erlauben).
          files: 3D-Manager.apk
